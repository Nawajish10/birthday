<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A1525" />
      <stop offset="100%" stop-color="#1A0F1F" />
    </radialGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9D7DC" />
      <stop offset="50%" stop-color="#E8A7B0" />
      <stop offset="100%" stop-color="#B6535F" />
    </linearGradient>
    <linearGradient id="goldShimmer" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C69325" />
      <stop offset="50%" stop-color="#F1C75B" />
      <stop offset="100%" stop-color="#FFE8A3" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background circular badge -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGlow)" stroke="url(#goldShimmer)" stroke-width="2" />
  
  <!-- Outer subtle sparkle ring -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="url(#roseGold)" stroke-width="0.75" stroke-dasharray="3 4" opacity="0.6" />

  <!-- Floral Rose Bloom Petals -->
  <g filter="url(#shadow)" transform="translate(64, 64)">
    <!-- 8 Blooming Petals rotated in symmetry -->
    <path d="M 0 -36 C 14 -36 22 -20 0 0 C -22 -20 -14 -36 0 -36 Z" fill="url(#roseGold)" opacity="0.9" />
    <path d="M 0 -36 C 14 -36 22 -20 0 0 C -22 -20 -14 -36 0 -36 Z" fill="url(#roseGold)" opacity="0.9" transform="rotate(45)" />
    <path d="M 0 -36 C 14 -36 22 -20 0 0 C -22 -20 -14 -36 0 -36 Z" fill="url(#roseGold)" opacity="0.9" transform="rotate(90)" />
    <path d="M 0 -36 C 14 -36 22 -20 0 0 C -22 -20 -14 -36 0 -36 Z" fill="url(#roseGold)" opacity="0.9" transform="rotate(135)" />
    <path d="M 0 -36 C 14 -36 22 -20 0 0 C -22 -20 -14 -36 0 -36 Z" fill="url(#roseGold)" opacity="0.9" transform="rotate(180)" />
    <path d="M 0 -36 C 14 -36 22 -20 0 0 C -22 -20 -14 -36 0 -36 Z" fill="url(#roseGold)" opacity="0.9" transform="rotate(225)" />
    <path d="M 0 -36 C 14 -36 22 -20 0 0 C -22 -20 -14 -36 0 -36 Z" fill="url(#roseGold)" opacity="0.9" transform="rotate(270)" />
    <path d="M 0 -36 C 14 -36 22 -20 0 0 C -22 -20 -14 -36 0 -36 Z" fill="url(#roseGold)" opacity="0.9" transform="rotate(315)" />

    <!-- Inner Golden Heart / Stamen -->
    <circle cx="0" cy="0" r="11" fill="url(#goldShimmer)" />
    <path d="M 0 5 C -7 0 -8 -6 -3 -7 C -0.5 -7.5 0 -4 0 -4 C 0 -4 0.5 -7.5 3 -7 C 8 -6 7 0 0 5 Z" fill="#6B1D2F" transform="scale(0.9) translate(0, 2)" />
  </g>
</svg>

